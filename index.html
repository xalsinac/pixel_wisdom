<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f9fafb">
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PixelWisdom">
    
    <title>Pixel Wisdom</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');
        
        body { 
            margin: 0; padding: 0; overflow-x: hidden; 
            overscroll-behavior-x: none; 
            user-select: none; 
            font-family: 'Space Mono', monospace;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef, useMemo } = React;

        // --- ICONOS ---
        const Icon = ({ children, className = "", fill = "none" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            {children}
          </svg>
        );

        const Heart = ({ className, fill }) => <Icon className={className} fill={fill}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></Icon>;
        const ChevronLeft = ({ className }) => <Icon className={className}><path d="m15 18-6-6 6-6"/></Icon>;
        const ChevronRight = ({ className }) => <Icon className={className}><path d="m9 18 6-6-6-6"/></Icon>;
        const Share2 = ({ className }) => <Icon className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></Icon>;
        const FilterIcon = ({ className }) => <Icon className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></Icon>;
        const XIcon = ({ className }) => <Icon className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
        const Trash2 = ({ className }) => <Icon className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></Icon>;
        const DownloadIcon = ({ className }) => <Icon className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></Icon>;
        const SearchIcon = ({ className }) => <Icon className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></Icon>;

        // --- DICCIONARIO & DATOS ---
        const AUTHOR_ASSETS = {
          "Gandalf": { avatar: "🧙‍♂️", color: "bg-slate-200" },
          "GLaDOS": { avatar: "🤖", color: "bg-orange-50" },
          "René Descartes": { avatar: "🦉", color: "bg-amber-50" },
          "Carl Sagan": { avatar: "🔭", color: "bg-blue-50" },
          "default": { avatar: "👤", color: "bg-gray-50" }
        };

        function AuthorArtwork({ author, fallback }) {
          const [imageFailed, setImageFailed] = useState(false);
          if (imageFailed) {
            return <div className="text-7xl md:text-8xl" aria-hidden="true">{fallback}</div>;
          }

          return (
            <img
              src={`./author/${encodeURIComponent(author)}.png`}
              alt={`Personaje pixel art: ${author}`}
              className="h-full w-auto max-w-full object-contain drop-shadow-[0_8px_8px_rgba(0,0,0,0.3)]"
              style={{ imageRendering: 'pixelated' }}
              onError={() => setImageFailed(true)}
            />
          );
        }

        function parseCsv(csv) {
          const headerLine = csv.split(/\r?\n/).find(line => /\bid\b/i.test(line) && /quote/i.test(line)) || '';
          const semicolonCount = (headerLine.match(/;/g) || []).length;
          const commaCount = (headerLine.match(/,/g) || []).length;
          const delimiter = semicolonCount > commaCount ? ';' : ',';
          const rows = [];
          let row = [];
          let field = '';
          let quoted = false;

          for (let i = 0; i < csv.length; i++) {
            const char = csv[i];
            if (quoted) {
              if (char === '"' && csv[i + 1] === '"') {
                field += '"';
                i++;
              } else if (char === '"') {
                quoted = false;
              } else {
                field += char;
              }
            } else if (char === '"') {
              quoted = true;
            } else if (char === delimiter) {
              row.push(field);
              field = '';
            } else if (char === '\n' || char === '\r') {
              if (char === '\r' && csv[i + 1] === '\n') i++;
              row.push(field);
              rows.push(row);
              row = [];
              field = '';
            } else {
              field += char;
            }
          }
          if (field || row.length) {
            row.push(field);
            rows.push(row);
          }

          while (rows.length && rows[0].every(value => !value.trim())) rows.shift();
          const headers = (rows.shift() || []).map(value => value.replace(/^\uFEFF/, '').trim());
          return rows.filter(values => values.some(value => value.trim())).map(values => {
            const record = Object.fromEntries(headers.map((header, index) => [header, values[index] || '']));
            return {
              id: Number(record.id),
              text: record.quote,
              spaQuote: record['spa-quote'] || record.frase || '',
              author: record.author,
              sourceType: record.source,
              theme: record.theme
            };
          }).filter(quote => quote.id && quote.text && quote.author && quote.sourceType && quote.theme);
        }

        const normalizeSearchText = (value) => String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLocaleLowerCase('es');

        function App() {
          const [filters, setFilters] = useState({ themes: [], sourceTypes: [], authors: [], showFavs: false });
          const [searchQuery, setSearchQuery] = useState('');
          const [language, setLanguage] = useState(() => localStorage.getItem('pixelWisdomLanguage') || 'eng');
          const [isFilterModalOpen, setIsFilterModalOpen] = useState(false);
          const [currentIndex, setCurrentIndex] = useState(0);
          const [displayedText, setDisplayedText] = useState('');
          const [isTyping, setIsTyping] = useState(false);
          const typingStep = useRef(1);
          const [favorites, setFavorites] = useState([]);
          const [quotesDb, setQuotesDb] = useState([]);
          const [quotesLoading, setQuotesLoading] = useState(true);
          const [quotesLoadError, setQuotesLoadError] = useState(false);
          
          // Swipe Suave states
          const [dragX, setDragX] = useState(0);
          const [opacity, setOpacity] = useState(1);
          const [isDragging, setIsDragging] = useState(false);
          const [isAnimating, setIsAnimating] = useState(false);
          const touchStartX = useRef(0);

          // PWA Install State
          const [installPrompt, setInstallPrompt] = useState(null);

          useEffect(() => {
            fetch('./quotes.csv', { cache: 'no-cache' })
              .then(response => {
                if (!response.ok) throw new Error('No se pudo cargar quotes.csv');
                return response.text();
              })
              .then(csv => setQuotesDb(parseCsv(csv)))
              .catch(error => {
                console.error('Error cargando las frases:', error);
                setQuotesLoadError(true);
              })
              .finally(() => setQuotesLoading(false));

            const savedFavs = localStorage.getItem('pixelWisdomFavs');
            if (savedFavs) {
              try { setFavorites(JSON.parse(savedFavs)); } catch (e) {}
            }
            
            // Cazar el evento de instalación nativo
            const handleBeforeInstallPrompt = (e) => {
              e.preventDefault();
              setInstallPrompt(e);
            };
            window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          }, []);

          const handleInstallApp = async () => {
            if (!installPrompt) return;
            installPrompt.prompt();
            const { outcome } = await installPrompt.userChoice;
            setInstallPrompt(null);
          };

          const filteredQuotes = useMemo(() => {
            const query = normalizeSearchText(searchQuery.trim());
            return quotesDb.filter(q => {
              const matchTheme = filters.themes.length === 0 || filters.themes.includes(q.theme);
              const matchSource = filters.sourceTypes.length === 0 || filters.sourceTypes.includes(q.sourceType);
              const matchAuthor = filters.authors.length === 0 || filters.authors.includes(q.author);
              const matchFav = !filters.showFavs || favorites.includes(q.id);
              const searchableText = normalizeSearchText(`${q.text} ${q.spaQuote} ${q.author} ${q.sourceType} ${q.theme}`);
              const matchSearch = !query || searchableText.includes(query);
              return matchTheme && matchSource && matchAuthor && matchFav && matchSearch;
            });
          }, [quotesDb, filters, favorites, searchQuery]);

          const themes = [...new Set(quotesDb.map(q => q.theme))].sort();
          const sources = [...new Set(quotesDb.map(q => q.sourceType))].sort();
          const authors = [...new Set(quotesDb.map(q => q.author))].sort();

          useEffect(() => { setCurrentIndex(0); }, [filters, searchQuery]);
          useEffect(() => {
            if (filteredQuotes.length > 0) {
              setCurrentIndex(Math.floor(Math.random() * filteredQuotes.length));
            }
          }, [quotesDb]);

          // A filter can shrink the result list before the reset effect runs.
          // Clamp synchronously so the render never reads an undefined quote.
          const currentQuoteIndex = Math.min(currentIndex, Math.max(filteredQuotes.length - 1, 0));
          const currentQuote = filteredQuotes[currentQuoteIndex] || null;
          const hasSpanishTranslation = Boolean(currentQuote?.spaQuote?.trim());
          const displayedQuoteText = language === 'spa' && hasSpanishTranslation ? currentQuote.spaQuote : currentQuote?.text || '';
          const isShowingEnglishFallback = language === 'spa' && currentQuote && !hasSpanishTranslation;

          useEffect(() => {
            if (!currentQuote || isAnimating) return;
            let i = 0;
            typingStep.current = 1;
            setDisplayedText('');
            setIsTyping(true);
            const fullText = displayedQuoteText;
            const interval = setInterval(() => {
              i = Math.min(i + typingStep.current, fullText.length);
              setDisplayedText(fullText.substring(0, i));
              if (i >= fullText.length) {
                clearInterval(interval);
                setIsTyping(false);
              }
            }, 16);
            return () => clearInterval(interval);
          }, [currentQuote, isAnimating, language]);

          // Lógica avanzada de Swipe
          const changeQuoteAnimated = (direction) => {
            if (filteredQuotes.length <= 1 || isAnimating) return;
            setIsAnimating(true);
            setIsDragging(false);
            
            // 1. Salir volando
            setDragX(direction === 'next' ? -250 : 250);
            setOpacity(0);
            
            setTimeout(() => {
              // 2. Cambiar frase oculta
              setCurrentIndex((prev) => {
                const safeIndex = Math.min(prev, filteredQuotes.length - 1);
                return direction === 'next'
                  ? (safeIndex + 1) % filteredQuotes.length
                  : (safeIndex - 1 + filteredQuotes.length) % filteredQuotes.length;
              });
              
              // 3. Mover al lado contrario instantáneamente (sin transición)
              setIsDragging(true); 
              setDragX(direction === 'next' ? 250 : -250);
              
              // 4. Entrar volando
              setTimeout(() => {
                setIsDragging(false);
                setDragX(0);
                setOpacity(1);
                setTimeout(() => setIsAnimating(false), 250);
              }, 50);
            }, 250);
          };

          const handleTouchStart = (e) => {
            if (isAnimating) return;
            touchStartX.current = e.touches[0].clientX;
            setIsDragging(true);
            setDragX(0);
          };

          const handleTouchMove = (e) => {
            if (!isDragging || isAnimating) return;
            const diff = e.touches[0].clientX - touchStartX.current;
            setDragX(diff * 0.8);
          };

          const handleTouchEnd = () => {
            if (isAnimating) return;
            if (dragX < -60) changeQuoteAnimated('next');
            else if (dragX > 60) changeQuoteAnimated('prev');
            else {
              setIsDragging(false);
              setDragX(0); // Cancelar swipe
            }
          };

          const toggleFavorite = (id) => {
            setFavorites(prev => {
              const newFavs = prev.includes(id) ? prev.filter(favId => favId !== id) : [...prev, id];
              localStorage.setItem('pixelWisdomFavs', JSON.stringify(newFavs));
              return newFavs;
            });
          };

          const toggleFilter = (category, value) => {
            setFilters(prev => {
              const currentList = prev[category];
              return { ...prev, [category]: currentList.includes(value) ? currentList.filter(item => item !== value) : [...currentList, value] };
            });
          };

          const clearFilters = () => {
            setFilters({ themes: [], sourceTypes: [], authors: [], showFavs: false });
            setSearchQuery('');
          };

          const toggleLanguage = () => {
            const nextLanguage = language === 'eng' ? 'spa' : 'eng';
            setLanguage(nextLanguage);
            localStorage.setItem('pixelWisdomLanguage', nextLanguage);
          };

          const authorAssets = currentQuote && AUTHOR_ASSETS[currentQuote.author] ? AUTHOR_ASSETS[currentQuote.author] : AUTHOR_ASSETS["default"];
          const bgColor = currentQuote ? authorAssets.color : 'bg-gray-50';
          const isFav = currentQuote ? favorites.includes(currentQuote.id) : false;
          const isCharacterLeft = currentQuoteIndex % 2 === 0;
          const activeFiltersCount = filters.themes.length + filters.sourceTypes.length + filters.authors.length + (filters.showFavs ? 1 : 0) + (searchQuery.trim() ? 1 : 0);

          return (
            <div className={`min-h-screen flex flex-col transition-colors duration-700 ease-in-out ${bgColor} selection:bg-black selection:text-white overflow-hidden`} >
              
              <header className="w-full p-4 flex flex-col gap-3 z-10">
                <div className="w-full flex flex-wrap justify-between items-center gap-2">
                  <h1 className="text-xl md:text-2xl font-bold tracking-tight font-mono uppercase">
                    <span className="text-orange-500">PIXEL</span> <span className="text-cyan-500">WISDOM</span>
                  </h1>
                  <div className="flex items-center gap-2">
                    <button onClick={toggleLanguage} aria-label={language === 'eng' ? 'Cambiar idioma a español' : 'Switch language to English'} className="px-3 py-2 bg-white border-2 border-gray-900 font-bold text-xs uppercase shadow-[3px_3px_0_0_rgba(17,24,39,1)] active:translate-y-[2px] active:translate-x-[2px] active:shadow-none transition-all">
                      {language === 'eng' ? 'ENG' : 'SPA'}
                    </button>
                    {installPrompt && (
                      <button onClick={handleInstallApp} className="flex items-center gap-2 px-3 py-2 bg-emerald-400 border-2 border-gray-900 font-bold text-xs uppercase shadow-[3px_3px_0_0_rgba(17,24,39,1)] active:translate-y-[2px] active:translate-x-[2px] active:shadow-none transition-all">
                        <DownloadIcon className="w-4 h-4" /> Instalar App
                      </button>
                    )}
                  </div>
                </div>
                <label className="relative w-full max-w-2xl mx-auto">
                  <SearchIcon className="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500" />
                  <input
                    type="search"
                    value={searchQuery}
                    onChange={event => setSearchQuery(event.target.value)}
                    placeholder="Buscar en el catálogo…"
                    aria-label="Buscar frase, autor o fuente"
                    className="w-full pl-10 pr-10 py-3 bg-white border-2 border-gray-900 rounded-lg font-mono text-sm shadow-[3px_3px_0_0_rgba(17,24,39,1)] focus:outline-none focus:ring-2 focus:ring-cyan-500"
                  />
                  {searchQuery && (
                    <button type="button" onClick={() => setSearchQuery('')} aria-label="Borrar búsqueda" className="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-gray-600 hover:text-gray-900">
                      <XIcon className="w-5 h-5" />
                    </button>
                  )}
                </label>
              </header>

              <main 
                className="flex-1 flex flex-col items-center justify-center relative px-4 w-full max-w-4xl mx-auto"
                onTouchStart={handleTouchStart} 
                onTouchMove={handleTouchMove} 
                onTouchEnd={handleTouchEnd}
              >
                <button onClick={() => changeQuoteAnimated('prev')} className="hidden md:flex absolute left-0 p-4 bg-white border-4 border-gray-900 rounded-full shadow-[6px_6px_0_0_rgba(17,24,39,1)] active:translate-y-[4px] active:translate-x-[4px] active:shadow-none z-20"><ChevronLeft className="w-8 h-8" /></button>

                {filteredQuotes.length > 0 ? (
                  <div 
                    className="flex flex-col w-full max-w-2xl mt-[-10vh]"
                    style={{ 
                      transform: `translateX(${dragX}px)`, 
                      opacity: opacity,
                      transition: isDragging ? 'none' : 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease'
                    }}
                  >
                    <div className="relative w-full bg-white border-4 border-gray-900 rounded-2xl p-6 md:p-8 shadow-[8px_8px_0_0_rgba(17,24,39,1)]">
                      {isShowingEnglishFallback && <p className="mb-3 text-[10px] font-bold uppercase tracking-wide text-gray-500">Traducción pendiente · original en inglés</p>}
                      <p
                        onClick={() => { if (isTyping) typingStep.current = 6; }}
                        onKeyDown={event => {
                          if (isTyping && (event.key === 'Enter' || event.key === ' ')) {
                            event.preventDefault();
                            typingStep.current = 6;
                          }
                        }}
                        role={isTyping ? 'button' : undefined}
                        tabIndex={isTyping ? 0 : undefined}
                        aria-label={isTyping ? 'Acelerar aparición de la frase' : undefined}
                        title={isTyping ? 'Toca o haz clic para acelerar el texto' : undefined}
                        className="whitespace-pre-line font-mono text-lg md:text-2xl leading-relaxed text-gray-800 min-h-[120px] md:min-h-[100px] cursor-pointer"
                      >
                        {displayedText}{isTyping && <span className="inline-block w-2.5 h-5 bg-gray-900 ml-1 animate-pulse" />}
                      </p>
                      {isTyping && <p className="mt-2 text-right text-[10px] font-bold uppercase tracking-wide text-gray-400">Toca el texto para acelerarlo</p>}
                      
                      <div className="mt-6 flex justify-between items-end border-t-4 border-dashed border-gray-200 pt-4">
                        <div>
                          <p className="font-bold text-gray-900 uppercase tracking-widest text-sm md:text-base">{currentQuote.author}</p>
                          <div className="flex gap-2 mt-2">
                            <span className="text-xs bg-purple-100 text-purple-800 font-bold px-2 py-1 rounded border-2 border-purple-900">{currentQuote.theme}</span>
                            <span className="text-xs bg-teal-100 text-teal-800 font-bold px-2 py-1 rounded border-2 border-teal-900">{currentQuote.sourceType}</span>
                          </div>
                        </div>
                        <div className="flex gap-3 relative z-10">
                          <button onClick={(e) => { e.stopPropagation(); toggleFavorite(currentQuote.id); }} className="p-2 border-2 border-transparent hover:border-red-900 rounded transition-all"><Heart className={`w-6 h-6 transition-all ${isFav ? 'text-red-500 scale-110' : 'text-gray-400'}`} fill={isFav ? "currentColor" : "none"} /></button>
                        </div>
                      </div>
                      
                      <div className={`absolute -bottom-6 w-0 h-0 border-t-[24px] border-t-gray-900 transition-all duration-500 ${isCharacterLeft ? 'left-12 border-l-[20px] border-l-transparent' : 'right-12 border-r-[20px] border-r-transparent'}`}>
                        <div className={`absolute -top-[28px] w-0 h-0 border-t-[16px] border-t-white ${isCharacterLeft ? '-left-[18px] border-l-[14px] border-l-transparent' : '-right-[18px] border-r-[14px] border-r-transparent'}`} />
                      </div>
                    </div>

                    <div className={`flex w-full mt-8 transition-all duration-500 ${isCharacterLeft ? 'justify-start pl-4 md:pl-8' : 'justify-end pr-4 md:pr-8'}`}>
                      <div className="h-40 md:h-48 min-w-24 flex items-end justify-center animate-[bounce_2s_infinite]">
                        <AuthorArtwork key={currentQuote.author} author={currentQuote.author} fallback={authorAssets.avatar} />
                      </div>
                    </div>
                  </div>
                ) : quotesLoading ? (
                  <div className="text-center bg-white p-8 border-4 border-gray-900 shadow-[8px_8px_0_0_rgba(17,24,39,1)]">
                    <p className="text-lg font-bold">Cargando frases…</p>
                  </div>
                ) : quotesLoadError ? (
                  <div className="text-center bg-white p-8 border-4 border-gray-900 shadow-[8px_8px_0_0_rgba(17,24,39,1)]">
                    <p className="text-lg font-bold">No se pudo cargar el catálogo.</p>
                    <p className="mt-2 text-sm">Comprueba que el archivo quotes.csv esté publicado junto a la web.</p>
                  </div>
                ) : (
                  <div className="text-center bg-white p-8 border-4 border-gray-900 shadow-[8px_8px_0_0_rgba(17,24,39,1)]">
                    <p className="text-lg font-bold">No se encontraron frases.</p>
                    <button onClick={clearFilters} className="mt-4 px-4 py-2 bg-purple-200 border-2 border-gray-900 font-bold uppercase">Limpiar Filtros</button>
                  </div>
                )}
                <button onClick={() => changeQuoteAnimated('next')} className="hidden md:flex absolute right-0 p-4 bg-white border-4 border-gray-900 rounded-full shadow-[6px_6px_0_0_rgba(17,24,39,1)] active:translate-y-[4px] active:translate-x-[-4px] active:shadow-none z-20"><ChevronRight className="w-8 h-8" /></button>
              </main>

              <footer className="w-full p-4 flex justify-center z-10 sticky bottom-0">
                <button onClick={() => setIsFilterModalOpen(true)} className="flex items-center gap-2 px-6 py-3 bg-white border-4 border-gray-900 font-bold uppercase text-gray-900 shadow-[6px_6px_0_0_rgba(17,24,39,1)] active:translate-y-[4px] active:translate-x-[4px] active:shadow-none transition-all">
                  <FilterIcon className="w-5 h-5" /> Filtros
                  {activeFiltersCount > 0 && <span className="bg-teal-400 text-gray-900 px-2 py-0.5 rounded-full border-2 border-gray-900 text-sm ml-2">{activeFiltersCount}</span>}
                </button>
              </footer>

              {isFilterModalOpen && (
                <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                  <div className="w-full max-w-lg bg-white border-4 border-gray-900 shadow-[8px_8px_0_0_rgba(17,24,39,1)] max-h-[85vh] flex flex-col">
                    <div className="flex justify-between items-center p-4 border-b-4 border-gray-900 bg-gray-50">
                  <div>
                    <h2 className="font-bold text-xl uppercase">Filtros</h2>
                    <p className="text-xs text-gray-600 mt-1" aria-live="polite">{filteredQuotes.length} de {quotesDb.length} frases</p>
                  </div>
                      <button onClick={() => setIsFilterModalOpen(false)} className="p-1 hover:bg-gray-200 border-2 border-transparent hover:border-gray-900 rounded"><XIcon className="w-6 h-6" /></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-6 space-y-8">
                      <div className="flex items-center justify-between p-4 border-4 border-gray-900 bg-red-50 cursor-pointer active:bg-red-100" onClick={() => setFilters(p => ({ ...p, showFavs: !p.showFavs }))}>
                        <span className="font-bold uppercase text-red-900">Solo Favoritos</span>
                        <Heart className={`w-6 h-6 ${filters.showFavs ? 'text-red-500' : 'text-gray-400'}`} fill={filters.showFavs ? "currentColor" : "none"} />
                      </div>
                      
                      {['themes', 'sourceTypes', 'authors'].map((category, idx) => (
                        <div key={category}>
                          <h3 className="text-gray-500 mb-3 font-bold uppercase text-sm">
                            {['Tema', 'Fuente', 'Autor / personaje'][idx]}
                            {filters[category].length > 0 && <span className="ml-2 text-purple-700">({filters[category].length})</span>}
                          </h3>
                          <div className="flex flex-wrap gap-2">
                            {(category === 'themes' ? themes : category === 'sourceTypes' ? sources : authors).map(item => (
                              <button 
                                key={item} 
                                onClick={() => toggleFilter(category, item)} 
                                className={`px-3 py-1.5 border-2 border-gray-900 font-bold transition-all ${filters[category].includes(item) ? 'bg-purple-400 text-white shadow-[2px_2px_0_0_rgba(17,24,39,1)] translate-x-[-2px] translate-y-[-2px]' : 'bg-white text-gray-700 hover:bg-gray-100'}`}
                              >
                                {item}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                    <div className="p-4 border-t-4 border-gray-900 bg-white flex gap-4">
                      <button onClick={clearFilters} className="flex-1 py-3 border-4 border-gray-900 font-bold uppercase flex justify-center items-center gap-2 hover:bg-gray-100"><Trash2 className="w-5 h-5" /> Limpiar</button>
                      <button onClick={() => setIsFilterModalOpen(false)} className="flex-1 py-3 bg-gray-900 text-white font-bold uppercase border-4 border-gray-900">Ver ({filteredQuotes.length})</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
      if ('serviceWorker' in navigator) {
       window.addEventListener('load', async () => {
      try {
        const registration =
          await navigator.serviceWorker.register('./sw.js');

         console.log('Service Worker registrado:', registration.scope);
           } catch (error) {
        console.error('Error registrando el Service Worker:', error);
        }
      });
      }
    </script>

</body>
</html>
