<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Wisdom</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PixelWisdom">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Librerías -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');
    .font-pixel { font-family: 'Press Start 2P', monospace; }
    .font-mono { font-family: 'Space Mono', monospace; }
    body { overscroll-behavior-y: none; overscroll-behavior-x: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen selection:bg-orange-500 selection:text-slate-950 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Iconos integrados
    const FilterIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
    );

    const XIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );

    const QUOTES_DATA = [
      { id: 1, quote: "No todos los que vagan están perdidos.", author: "Gandalf", theme: "Vida", source: "Películas" },
      { id: 2, quote: "El misterio de la vida no es un problema a resolver, sino una realidad a experimentar.", author: "Dune", theme: "Filosofía", source: "Libros" },
      { id: 3, quote: "La ciencia es el intento sistemático de someter la experiencia sensible a una regla lógica.", author: "Einstein", theme: "Ciencia", source: "Historia" },
      { id: 4, quote: "La felicidad solo es real cuando se comparte.", author: "Into the Wild", theme: "Vida", source: "Películas" },
      { id: 5, quote: "La medida del amor es amar sin medida.", author: "San Agustín", theme: "Amor", source: "Filosofía" }
    ];

    const AUTHOR_ASSETS = {
      "Gandalf": { avatar: "🧙‍♂️", bg: "bg-slate-200" },
      "Dune": { avatar: "🪐", bg: "bg-amber-100" },
      "Einstein": { avatar: "💡", bg: "bg-blue-100" },
      "Into the Wild": { avatar: "🏕️", bg: "bg-emerald-100" },
      "San Agustín": { avatar: "📜", bg: "bg-red-100" },
      "default": { avatar: "☕", bg: "bg-slate-200" }
    };

    function App() {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [displayedText, setDisplayedText] = useState("");
      const [isTyping, setIsTyping] = useState(true);
      const [favorites, setFavorites] = useState(() => JSON.parse(localStorage.getItem("pw_favs") || "[]"));
      
      // Estado de filtros avanzados
      const [isFilterOpen, setIsFilterOpen] = useState(false);
      const [filters, setFilters] = useState({ theme: [], source: [] });

      // Estado de Swipe
      const [dragX, setDragX] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const touchStartX = useRef(0);

      // Extraer categorías únicas para el menú
      const availableThemes = [...new Set(QUOTES_DATA.map(q => q.theme))];
      const availableSources = [...new Set(QUOTES_DATA.map(q => q.source))];

      const filteredQuotes = useMemo(() => {
        let result = QUOTES_DATA;
        if (filters.favorites) {
          result = result.filter(q => favorites.includes(q.id));
        }
        if (filters.theme.length > 0) {
          result = result.filter(q => filters.theme.includes(q.theme));
        }
        if (filters.source.length > 0) {
          result = result.filter(q => filters.source.includes(q.source));
        }
        return result.length > 0 ? result : [QUOTES_DATA[0]];
      }, [filters, favorites]);

      const currentQuote = filteredQuotes[currentIndex] || filteredQuotes[0];
      const asset = AUTHOR_ASSETS[currentQuote.author] || AUTHOR_ASSETS["default"];
      const isAvatarRight = currentIndex % 2 !== 0;

      useEffect(() => {
        setDisplayedText("");
        setIsTyping(true);
        let i = 0;
        const speed = 25;
        const timer = setInterval(() => {
          if (i < currentQuote.quote.length) {
            setDisplayedText(currentQuote.quote.slice(0, i + 1));
            i++;
          } else {
            setIsTyping(false);
            clearInterval(timer);
          }
        }, speed);
        return () => clearInterval(timer);
      }, [currentIndex, currentQuote]);

      const handleNext = () => {
        setDragX(0);
        setCurrentIndex((prev) => (prev + 1) % filteredQuotes.length);
      };

      const handlePrev = () => {
        setDragX(0);
        setCurrentIndex((prev) => (prev - 1 + filteredQuotes.length) % filteredQuotes.length);
      };

      // Swipe Handlers
      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
        setIsDragging(true);
      };

      const handleTouchMove = (e) => {
        if (!isDragging) return;
        const currentX = e.touches[0].clientX;
        const diff = currentX - touchStartX.current;
        setDragX(diff * 0.7); 
      };

      const handleTouchEnd = () => {
        setIsDragging(false);
        if (dragX < -70) {
          handleNext();
        } else if (dragX > 70) {
          handlePrev();
        } else {
          setDragX(0);
        }
      };

      const toggleFavorite = (id) => {
        const next = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
        setFavorites(next);
        localStorage.setItem("pw_favs", JSON.stringify(next));
      };

      const toggleFilter = (category, value) => {
        setFilters(prev => {
          const current = prev[category];
          const updated = current.includes(value) ? current.filter(item => item !== value) : [...current, value];
          return { ...prev, [category]: updated };
        });
        setCurrentIndex(0);
      };

      return (
        <div 
          className="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto relative overflow-hidden"
          onTouchStart={handleTouchStart}
          onTouchMove={handleTouchMove}
          onTouchEnd={handleTouchEnd}
        >
          {/* Header */}
          <header className="flex justify-between items-center py-2 z-10">
            <h1 className="text-sm font-pixel tracking-wider">
              <span className="text-orange-500">PIXEL</span> <span className="text-cyan-400">WISDOM</span>
            </h1>
            <button 
              onClick={() => toggleFavorite(currentQuote.id)}
              className={`p-2 rounded border-2 border-slate-700 transition-colors ${favorites.includes(currentQuote.id) ? 'bg-red-500 text-white' : 'bg-slate-800'}`}
            >
              ♥
            </button>
          </header>

          {/* Tarjeta central animada */}
          <main 
            className="flex-1 flex flex-col justify-center my-auto transition-transform w-full z-0"
            style={{
              transform: `translateX(${dragX}px)`,
              transition: isDragging ? 'none' : 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)',
              opacity: Math.max(0.3, 1 - Math.abs(dragX) / 300)
            }}
          >
            <div 
              onClick={() => { if (isTyping) { setDisplayedText(currentQuote.quote); setIsTyping(false); } }}
              className="w-full bg-slate-100 text-slate-900 border-4 border-slate-950 p-5 rounded-lg shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] relative mb-8 min-h-[140px] flex flex-col justify-between"
            >
              <p className="font-mono text-base font-medium leading-relaxed">
                "{displayedText}"
                {isTyping && <span className="inline-block w-2 h-4 bg-slate-900 ml-1 animate-pulse"></span>}
              </p>
              <div className="text-right text-xs font-mono text-slate-500 mt-3 font-bold">
                — {currentQuote.author}
              </div>
              
              <div className={`absolute -bottom-3 ${isAvatarRight ? 'right-10' : 'left-10'} w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[12px] border-t-slate-950`}></div>
            </div>

            <div className={`flex ${isAvatarRight ? 'justify-end' : 'justify-start'} w-full`}>
              <div className={`w-24 h-24 ${asset.bg} border-4 border-slate-950 rounded-2xl flex items-center justify-center text-4xl shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]`}>
                {asset.avatar}
              </div>
            </div>
          </main>

          {/* Menú Inferior */}
          <footer className="space-y-4 pb-2 z-10">
            <button 
              onClick={() => setIsFilterOpen(true)}
              className="w-full flex items-center justify-center gap-2 py-3 bg-slate-800 border-2 border-slate-700 rounded font-mono text-sm active:bg-slate-700"
            >
              <FilterIcon /> 
              Filtros {(filters.theme.length > 0 || filters.source.length > 0 || filters.favorites) && "(Activos)"}
            </button>

            <div className="flex justify-between items-center text-xs font-mono text-slate-400">
              <button onClick={handlePrev} className="px-4 py-2 border-2 border-slate-700 rounded bg-slate-800 active:bg-slate-700">← Ant</button>
              <span>{currentIndex + 1} / {filteredQuotes.length}</span>
              <button onClick={handleNext} className="px-4 py-2 border-2 border-slate-700 rounded bg-slate-800 active:bg-slate-700">Sig →</button>
            </div>
          </footer>

          {/* Modal de Filtros */}
          {isFilterOpen && (
            <div className="absolute inset-0 bg-slate-900/95 z-50 flex flex-col p-6 font-mono">
              <div className="flex justify-between items-center mb-8">
                <h2 className="text-xl font-bold">Filtros</h2>
                <button onClick={() => setIsFilterOpen(false)} className="p-2 bg-slate-800 rounded border-2 border-slate-700">
                  <XIcon />
                </button>
              </div>

              <div className="space-y-6 overflow-y-auto pb-6">
                <div>
                  <h3 className="text-sm text-slate-400 mb-3 uppercase tracking-wider">Especiales</h3>
                  <button 
                    onClick={() => { setFilters(p => ({...p, favorites: !p.favorites})); setCurrentIndex(0); }}
                    className={`px-3 py-2 border-2 rounded text-sm w-full text-left ${filters.favorites ? 'bg-red-500 border-red-500 text-white font-bold' : 'border-slate-700 bg-slate-800'}`}
                  >
                    ❤️ Solo Favoritos
                  </button>
                </div>

                <div>
                  <h3 className="text-sm text-slate-400 mb-3 uppercase tracking-wider">Temáticas</h3>
                  <div className="flex flex-wrap gap-2">
                    {availableThemes.map(theme => (
                      <button 
                        key={theme} 
                        onClick={() => toggleFilter('theme', theme)}
                        className={`px-3 py-1.5 border-2 rounded text-sm ${filters.theme.includes(theme) ? 'bg-cyan-500 border-cyan-500 text-slate-900 font-bold' : 'border-slate-700 bg-slate-800'}`}
                      >
                        {theme}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <h3 className="text-sm text-slate-400 mb-3 uppercase tracking-wider">Orígenes</h3>
                  <div className="flex flex-wrap gap-2">
                    {availableSources.map(source => (
                      <button 
                        key={source} 
                        onClick={() => toggleFilter('source', source)}
                        className={`px-3 py-1.5 border-2 rounded text-sm ${filters.source.includes(source) ? 'bg-orange-500 border-orange-500 text-slate-900 font-bold' : 'border-slate-700 bg-slate-800'}`}
                      >
                        {source}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <button 
                onClick={() => { setFilters({ theme: [], source: [] }); setCurrentIndex(0); }}
                className="mt-auto py-3 bg-slate-800 border-2 border-slate-700 rounded text-sm active:bg-slate-700"
              >
                Limpiar Filtros
              </button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error:', err));
      });
    }
  </script>
</body>
</html>
